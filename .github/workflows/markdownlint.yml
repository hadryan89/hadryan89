name: Markdown lint

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".markdownlint.jsonc"]
  pull_request:
    paths: ["**/*.md", ".markdownlint.jsonc"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
